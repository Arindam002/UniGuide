name: uniguide
description: A RAG-based study application for JNGEC students.
publish_to: 'none'

environment:
  sdk: '>=3.1.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.6
  http: ^1.1.0
  image_picker: ^1.2.0
  shared_preferences: ^2.5.3
  url_launcher: ^6.3.0

  
  uuid: ^4.4.0
  flutter_highlight: ^0.7.0
  flutter_markdown_plus: ^1.0.12
  markdown: ^7.3.1
  google_fonts: ^6.2.1
  flutter_svg: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
